# =============================================================================
# OIRIA / rShell  os.conf  —  boot-time OS config
# =============================================================================
# This doc is Parsed once on boot (before appManager / window env settle).
# Editable later from device Settings app (writes back to NVS + this file on SD
# when present: /sdcard/conf/os.conf).
#
# Format:  key = value
# Comments: lines starting with # or blank lines ignored.
# Sections are documentary only (parser is flat key=value).
#
# Priority (first match wins for each key):
#   1) /sdcard/conf/os.conf          (if MicroSD present)
#   2) embedded / factory os.conf    (this file, linked into firmware)
#   3) NVS namespace "rshell"         (last-known-good from Settings)
#   4) compile-time / EnvConfig defaults in env_vars.c
#
# Keys map into EnvConfig (v_env) and boot_role / power policy.
# =============================================================================

# -----------------------------------------------------------------------------
# [window_environment]
# Consumed by WindowManager / MWenv / display push task.
# -----------------------------------------------------------------------------
fpsTarget            = 45          # target redraw rate (Hz); apps may request lower
framethrottle_target = 30          # used when UseFrameThrottle = true
UseFrameThrottle     = false       # true → clamp to framethrottle_target
brightness           = 80          # 0–100 (LCD backlight %)
screen_dim_w         = 240         # logical panel width
screen_dim_h         = 280         # logical panel height
screenGamma          = 1.0         # display gamma tweak

# -----------------------------------------------------------------------------
# [power]
# Power policy applied after boot_role is resolved.
# -----------------------------------------------------------------------------
# powerMode:
#   normal       – default tick + display duty cycle
#   deep_sleep   – aggressive sleep; wake on button / RTC / UART activity
#   stay_awake   – never enter light/deep sleep (monitor / always-on / debug)
powerMode            = normal
# Optional helpers (used when powerMode = deep_sleep):
# deepSleepIdleSec   = 30          # seconds of idle before deep sleep
# stayAwakeAsMonitor = false       # if true, force stay_awake when UART client attached

# -----------------------------------------------------------------------------
# [boot_role]
# Same firmware, different personality (see window_env/boot_role.hpp).
# Overrides NVS / Kconfig when present in this file.
# -----------------------------------------------------------------------------
# bootRole:
#   solo     – single chip: local apps + local LCD (default)
#   tyrant   – display / orchestrator: receives DomFrames, drives LCD
#   puppet   – headless logic worker: packs DomFrames, no LCD
bootRole             = solo

# Is this node acting as a remote-control endpoint?
# (tyrant can command puppets; a dedicated remote may only send control packets)
isRemoteControl      = false

# Remote-control / collab protocol (when isRemoteControl or bootRole ≠ solo)
#   none     – disabled
#   rsdom    – RSDOM over UART (DomFrame + control packets, see COLLAB_DOM_NOTES)
#   uart_raw – simple line protocol for scripts / tools
remoteControlProtocol = none

# UART client / server / puppet link role (collective UART / RS_UartConf)
#   client   – initiates / drives the link
#   server   – listens / applies frames
#   puppet   – headless worker side of tyrant↔puppet pair
uartLinkRole         = client

# -----------------------------------------------------------------------------
# [system]  – mirrors common EnvConfig knobs (also reachable via rs_vm sysconf)
# -----------------------------------------------------------------------------
headless             = false
debugMode            = false
safeMode             = false
cpuMhzTarget         = 240
enableCpuScaling     = true

# -----------------------------------------------------------------------------
# END
# =============================================================================
